# Define a service to check the number of currently logged in users on the local machine.
define service {

    use                     local-service           ; Name of service template to use
    host_name               mgtNodeMac4
    service_description     Current Users
    check_command           check_nrpe_remote!check_users
}

# Define a service to check the load on the local machine.
define service {

    use                     local-service           ; Name of service template to use
    host_name               mgtNodeMac4
    service_description     Current Load
    check_command           check_nrpe_remote!check_load
}

# Define a service to check the number of zombie running procs on the local machine.  
define service {

    use                     local-service           ; Name of service template to use
    host_name               mgtNodeMac4
    service_description     Zombie Processes
    check_command           check_nrpe_remote!check_zombie_procs
}


# Define a service to check the number of currently running procs on the local machine.

define service {

    use                     local-service           ; Name of service template to use
    host_name               mgtNodeMac4
    service_description     Total Processes
    check_command           check_nrpe_remote!check_total_procs
}


# Define a service to check the disk space of the root partition on the local machine.
define service {

    use                     local-service           ; Name of service template to use
    host_name               mgtNodeMac4
    service_description     Root Partition
    check_command           check_nrpe_remote!check_root_disk
}


# Define a service to check the swap usage the local machine.
define service {

    use                     local-service           ; Name of service template to use
    host_name               mgtNodeMac4
    service_description     Swap Usage
    check_command           check_nrpe_remote!check_swap
}

# Define a service to check SSH on the local machine.
define service {

    use                     local-service           ; Name of service template to use
    host_name               mgtNodeMac4
    service_description     SSH
    check_command           check_nrpe_remote!check_ssh
    notifications_enabled   0
}

# Define a service to check HTTP on the local machine.
define service {

    use                     local-service           ; Name of service template to use
    host_name               mgtNodeMac4
    service_description     HTTP
    check_command           check_nrpe_remote!check_http
    notifications_enabled   0
}
